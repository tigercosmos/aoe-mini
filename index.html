<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AoE Mini</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070908;
      }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 35%, rgba(82, 111, 60, 0.18), rgba(7, 9, 8, 0.75) 62%);
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #minimap {
        position: absolute;
        right: 12px;
        bottom: 8px;
        width: 200px;
        height: 200px;
        box-sizing: content-box;
        background: #020202;
        border: 8px solid #4e4434;
        border-top-color: #7e745f;
        border-left-color: #6d614b;
        border-right-color: #211a14;
        border-bottom-color: #18110c;
        box-shadow:
          0 0 0 2px #100b08,
          0 0 0 3px #8a7548,
          0 18px 46px rgba(0, 0, 0, 0.42),
          inset 0 0 0 2px #0d0906;
        z-index: 2;
      }
      #hud {
        position: absolute;
        inset: 0;
        z-index: 3;
      }
      @media (max-width: 860px) {
        #minimap {
          width: 154px;
          height: 154px;
          bottom: calc(42vh + 18px);
        }
      }
      @media (max-width: 560px) {
        #minimap {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <canvas id="minimap" width="200" height="200"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
